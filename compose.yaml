services:
  app:
    build:
      context: .
    init: true
    environment:
      PORT: "3000"
      STATIC_DIR: /app/apps/web/dist
      DATABASE_URL: postgresql://agent_platform:devpassword@postgres:5432/agent_platform
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      MODEL: ${MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_URL: http://host.docker.internal:11434
      SHUTDOWN_TIMEOUT_MS: "10000"
    ports:
      - "${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-bookworm
    # Local development example credentials; keep aligned with DATABASE_URL.
    environment:
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: agent_platform
    ports:
      # Set PGPORT=5433 (for example) if local PostgreSQL already uses 5432.
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
